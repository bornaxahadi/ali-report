<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>گزارش‌های آقای علی</title>
<meta name="theme-color" content="#1B2350">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B5BD6'/%3E%3Cstop offset='1' stop-color='%230E9AA7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6 19l3-6h12l5 6v4H6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#F3F5FB;--surface:#fff;--ink:#16213E;--muted:#66708A;--navy:#1B2350;--indigo:#5B5BD6;--teal:#0E9AA7;
  --shadow:0 1px 2px rgba(22,33,62,.05),0 6px 20px -8px rgba(22,33,62,.12)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;font-size:16px;line-height:1.75;
  background-image:radial-gradient(900px 420px at 100% -10%,#E7E6FB 0,transparent 60%),radial-gradient(700px 380px at -10% 0,#DDF2F3 0,transparent 55%);background-repeat:no-repeat}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.3}
.brand .logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--indigo),var(--teal));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(91,91,214,.7)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:4px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.greet{margin:10px 2px 18px}
.greet h1{margin:0;font-size:26px;font-weight:900;line-height:1.4}
.greet p{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.cards{display:grid;gap:18px}
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;border-radius:28px;color:#fff;text-decoration:none;
  box-shadow:0 18px 36px -18px rgba(22,33,62,.55);transition:transform .15s ease,box-shadow .15s ease}
.card:active{transform:scale(.98)}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 24px 40px -18px rgba(22,33,62,.6)}}
.card.cars{background:linear-gradient(150deg,#6C5CE7 0%,#5B5BD6 45%,#EF6F53 100%)}
.card.ships{background:linear-gradient(150deg,#0E9AA7 0%,#1F6FB2 55%,#1B2350 100%)}
.card .art{order:2;height:118px;margin-top:6px;pointer-events:none}
.card .art svg{width:100%;height:100%;display:block}
.card .body{position:relative;padding:20px 20px 0}
.card .tag{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 12px;font-size:13px;font-weight:700}
.card h2{margin:10px 0 2px;font-size:25px;font-weight:900;line-height:1.35}
.card p{margin:0;font-size:15px;opacity:.95}
.card .stat{display:inline-flex;align-items:baseline;gap:6px;background:rgba(255,255,255,.95);color:var(--ink);border-radius:14px;padding:4px 12px;font-weight:800;font-size:14px}
.card .stat b{font-size:20px;font-weight:900}
.card.cars .stat b{color:#5B5BD6}.card.ships .stat b{color:#0E7C87}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.card .go{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.card .go svg{width:24px;height:24px;stroke-width:2.4}
[dir=rtl] .card .go svg{transform:scaleX(-1)}
.foot{margin:22px 4px 0;color:var(--muted);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14M3 17v-3.5l2.2-4.4A2 2 0 0 1 7 8h8.5a2 2 0 0 1 1.5.7l3 3.3h.5A1.5 1.5 0 0 1 22 13.5V17h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></symbol>
  <symbol id="i-ship" viewBox="0 0 24 24"><path d="M3 15h18l-2.5 5h-13zM6 15V9h12v6M9 9V5h6v4"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></symbol>
</svg>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo"><svg class="i"><use href="#i-grid"/></svg></span>
      <div><span data-t="brand"></span><small data-t="brandSub"></small></div></div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="fa">فا</button><button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <div class="greet"><h1 data-t="hello"></h1><p data-t="choose"></p></div>

  <main class="cards">
    <a class="card cars" href="cars.html">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMax meet">
        <path d="M0 120 Q100 100 200 116 T400 110 V150 H0z" fill="rgba(255,255,255,.12)"/>
        <rect x="0" y="128" width="400" height="22" fill="rgba(22,33,62,.35)"/>
        <path d="M30 139h40M110 139h40M190 139h40M270 139h40M350 139h40" stroke="rgba(255,255,255,.55)" stroke-width="3" stroke-linecap="round"/>
        <g transform="translate(98 28)">
          <path d="M8 58 L8 40 Q10 30 22 28 L52 24 Q70 6 100 6 L128 6 Q150 6 166 24 L184 28 Q196 31 196 44 L196 58 Z" fill="#fff"/>
          <path d="M62 26 Q76 13 98 13 L110 13 L110 26 Z" fill="#B9C8F5"/><path d="M118 13 L128 13 Q146 13 158 26 L118 26 Z" fill="#B9C8F5"/>
          <rect x="180" y="34" width="12" height="6" rx="3" fill="#F2A93B"/><rect x="10" y="36" width="10" height="6" rx="3" fill="#EF6F53"/>
          <circle cx="50" cy="60" r="16" fill="#16213E"/><circle cx="50" cy="60" r="7" fill="#C9CFE0"/>
          <circle cx="154" cy="60" r="16" fill="#16213E"/><circle cx="154" cy="60" r="7" fill="#C9CFE0"/>
        </g>
        <circle cx="70" cy="36" r="14" fill="rgba(255,255,255,.25)"/>
      </svg></div>
      <div class="body">
        <span class="tag"><svg class="i" style="width:16px;height:16px"><use href="#i-car"/></svg><span data-t="carTag"></span></span>
        <h2 data-t="carT"></h2>
        <p data-t="carS"></p>
        <div class="row"><span class="go"><span data-t="open"></span><svg class="i"><use href="#i-arrow"/></svg></span><span class="stat" id="carStat" hidden></span></div>
      </div>
    </a>

    <a class="card ships" href="ships.html">
      <div class="art" aria-hidden="true"><svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMax meet">
        <circle cx="70" cy="34" r="16" fill="rgba(255,255,255,.22)"/>
        <g transform="translate(105 18)">
          <path d="M0 64 L190 64 L172 92 L18 92 Z" fill="#fff"/>
          <rect x="22" y="44" width="34" height="20" rx="2" fill="#F2A93B"/><rect x="60" y="44" width="34" height="20" rx="2" fill="#EF6F53"/><rect x="98" y="44" width="34" height="20" rx="2" fill="#21915F"/>
          <rect x="140" y="22" width="34" height="42" rx="3" fill="#E3E9F7"/><rect x="146" y="28" width="22" height="8" rx="2" fill="#1F6FB2"/>
          <rect x="152" y="8" width="8" height="14" fill="#E3E9F7"/><rect x="150" y="4" width="12" height="5" rx="2" fill="#EF6F53"/>
          <path d="M18 92 L172 92" stroke="#1B2350" stroke-width="5"/>
        </g>
        <path d="M0 126 Q25 116 50 126 T100 126 T150 126 T200 126 T250 126 T300 126 T350 126 T400 126 V150 H0z" fill="rgba(255,255,255,.25)"/>
        <path d="M0 138 Q25 130 50 138 T100 138 T150 138 T200 138 T250 138 T300 138 T350 138 T400 138 V150 H0z" fill="rgba(255,255,255,.35)"/>
      </svg></div>
      <div class="body">
        <span class="tag"><svg class="i" style="width:16px;height:16px"><use href="#i-ship"/></svg><span data-t="shipTag"></span></span>
        <h2 data-t="shipT"></h2>
        <p data-t="shipS"></p>
        <div class="row"><span class="go"><span data-t="open"></span><svg class="i"><use href="#i-arrow"/></svg></span><span class="stat" id="shipStat" hidden></span></div>
      </div>
    </a>
  </main>

  <p class="foot" data-t="foot"></p>
</div>
<script>
const T={
 fa:{brand:"گزارش‌های آقای علی",brandSub:"خرید و تأمین",hello:"سلام قربان، خوش آمدید",choose:"کدام گزارش را می‌خواهید ببینید؟ روی یکی بزنید.",
   carTag:"خودرو",carT:"خرید خودروی BYD Seal 05",carS:"فروشنده‌ها، قیمت هر دستگاه، رنگ‌ها و موجودی",
   shipTag:"کشتی",shipT:"کشتی‌های باری خزر",shipS:"کشتی‌های فروشی برای حمل جو و ذرت از آستاراخان به ایران",
   open:"ورود به گزارش",foot:"در هر گزارش، دکمه «صفحه اصلی» شما را به اینجا برمی‌گرداند.",
   carN:n=>`<b>${n}</b> فروشنده`,shipN:n=>`<b>${n}</b> کشتی فروشی`,title:"گزارش‌های آقای علی"},
 en:{brand:"Mr. Ali's reports",brandSub:"Purchasing and sourcing",hello:"Hello, welcome",choose:"Which report would you like to see? Tap one.",
   carTag:"Cars",carT:"BYD Seal 05 car purchase",carS:"Suppliers, price per car, colors and stock",
   shipTag:"Ships",shipT:"Caspian cargo ships",shipS:"Ships for sale to carry barley and corn from Astrakhan to Iran",
   open:"Open report",foot:"In each report, the Home button brings you back here.",
   carN:n=>`<b>${n}</b> suppliers`,shipN:n=>`<b>${n}</b> ships for sale`,title:"Mr. Ali's reports"}
};
let lang="fa";try{lang=localStorage.getItem("lang")||"fa"}catch(e){}
const counts={car:null,ship:null};
const num=n=>Number(n).toLocaleString(lang==="fa"?"fa-IR":"en-US");
function render(){
  const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="fa"?"rtl":"ltr";document.title=t.title;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t[el.dataset.t];if(typeof v==="string")el.textContent=v});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  for(const [k,id] of [["car","carStat"],["ship","shipStat"]]){const el=document.getElementById(id);
    if(counts[k]){el.innerHTML=t[k+"N"](num(counts[k]));el.hidden=false}else el.hidden=true}
}
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]");if(!b)return;lang=b.dataset.lang;try{localStorage.setItem("lang",lang)}catch(_){}render()});
render();
const load=(u,f)=>fetch(u+"?t="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(d){f(d);render()}}).catch(()=>{});
load("data.json",d=>{counts.car=(d.suppliers||[]).length||null});
load("ships.json",d=>{counts.ship=(d.vessels||[]).length||null});
</script>
</body>
</html>
