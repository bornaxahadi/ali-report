<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>گزارش خرید BYD Seal 05</title>
<meta name="theme-color" content="#1B2350">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235B5BD6'/%3E%3Cstop offset='1' stop-color='%230E9AA7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M6 19l3-6h12l5 6v4H6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#16213E; --muted:#66708A; --line:#E3E7F1;
  --navy:#1B2350; --indigo:#5B5BD6; --indigo-soft:#ECECFC;
  --teal:#0E9AA7; --teal-soft:#DFF4F5; --saffron:#F2A93B; --saffron-ink:#9A5E00; --saffron-soft:#FFF1DA;
  --coral:#EF6F53; --coral-ink:#B23F25; --coral-soft:#FDE7E1; --green:#21915F; --green-soft:#DDF3E8;
  --r-xl:26px; --r-lg:20px; --r-sm:12px;
  --shadow:0 1px 2px rgba(22,33,62,.05),0 6px 20px -8px rgba(22,33,62,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,system-ui,sans-serif;font-size:16px;line-height:1.75;
  background-image:radial-gradient(900px 420px at 100% -10%,#E7E6FB 0,transparent 60%),radial-gradient(700px 380px at -10% 0,#DDF2F3 0,transparent 55%);background-repeat:no-repeat}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom))}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
button,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.flag{display:inline-block;flex:none;border-radius:3px;box-shadow:0 0 0 1px rgba(22,33,62,.12);overflow:hidden;vertical-align:middle}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;line-height:1.3}
.brand .logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--indigo),var(--teal));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px rgba(91,91,214,.7)}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:4px 14px;border-radius:999px;cursor:pointer;font-size:14px;color:var(--muted);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* hero */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;color:#fff;background:linear-gradient(170deg,#232C6B 0%,#1B2350 55%,#141A3D 100%);box-shadow:0 18px 40px -18px rgba(27,35,80,.65)}
.scene{position:relative;height:178px}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .sedan{position:absolute;bottom:4px;inset-inline-start:50%;width:290px;max-width:80%;height:auto;inset-block-start:auto;transform:translateX(-50%)}
[dir=rtl] .scene .sedan{transform:translateX(50%) scaleX(-1)}
.scene .tagm{position:absolute;top:14px;inset-inline-start:14px;font-size:12px;font-weight:700;color:#fff;background:rgba(22,33,62,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:2px 11px;border-radius:999px;direction:ltr;border:1px solid rgba(255,255,255,.25)}
.hbody{padding:6px 20px 20px}
.hero h1{margin:0;font-size:15px;font-weight:500;color:#C9CDF5}
.count{display:flex;align-items:baseline;gap:10px;margin:0 0 4px;flex-wrap:wrap}
.count b{font-size:60px;line-height:1.05;font-weight:900;letter-spacing:-.02em;background:linear-gradient(90deg,#FFD58A,#FFFFFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.count span{color:#C9CDF5}
.road{position:relative;height:54px;margin:4px 0 0}
.road .lane{position:absolute;inset:auto 0 24px 0;height:5px;border-radius:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.28) 0 12px,transparent 12px 22px)}
[dir=rtl] .road .lane{background:repeating-linear-gradient(270deg,rgba(255,255,255,.28) 0 12px,transparent 12px 22px)}
.road .done{position:absolute;bottom:24px;height:5px;border-radius:5px;background:linear-gradient(90deg,var(--teal),var(--saffron));inset-inline-start:0;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
[dir=rtl] .road .done{background:linear-gradient(270deg,var(--teal),var(--saffron))}
.road .car{position:absolute;bottom:27px;inset-inline-start:0;transition:inset-inline-start 1.2s cubic-bezier(.2,.8,.2,1);color:var(--saffron)}
.road .car svg{width:40px;height:19px;display:block}
[dir=rtl] .road .car svg{transform:scaleX(-1)}
.road .mark{position:absolute;bottom:0;font-size:12px;color:#AEB3E6;transform:translateX(-50%)}
[dir=rtl] .road .mark{transform:translateX(50%)}
.road .mark::before{content:"";position:absolute;bottom:19px;inset-inline-start:50%;width:1px;height:9px;background:rgba(255,255,255,.3)}
.hflags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.hflags span{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:2px 10px 2px 4px;font-size:13px;color:#E4E6FA}.hflags .flag{width:22px;height:15px;border-radius:4px}
.status{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:11px 13px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);font-size:15px}
.pulse{width:9px;height:9px;border-radius:50%;background:#5EF0C0;margin-top:9px;flex:none;box-shadow:0 0 0 0 rgba(94,240,192,.6);animation:p 2.4s infinite}
@keyframes p{70%{box-shadow:0 0 0 8px rgba(94,240,192,0)}100%{box-shadow:0 0 0 0 rgba(94,240,192,0)}}
.upd{font-size:12px;color:#AEB3E6;margin-top:2px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 28px}
.stat{border-radius:18px;padding:11px 10px 9px;display:flex;flex-direction:column;gap:1px;background:var(--surface);box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat i{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;margin-bottom:4px}
.stat i svg{width:17px;height:17px}
.stat b{font-size:24px;font-weight:900;line-height:1.25}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.4}
.c-teal i{background:var(--teal-soft);color:var(--teal)} .c-teal b{color:var(--teal)}
.c-indigo i{background:var(--indigo-soft);color:var(--indigo)} .c-indigo b{color:var(--indigo)}
.c-saffron i{background:var(--saffron-soft);color:var(--saffron-ink)} .c-saffron b{color:var(--saffron-ink)}
.c-coral i{background:var(--coral-soft);color:var(--coral-ink)} .c-coral b{color:var(--coral-ink)}

h2{font-size:19px;margin:0 0 12px;font-weight:800;display:flex;align-items:center;gap:10px}
h2 .hi{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff}
h2 .hi svg{width:18px;height:18px}
h2 .sub2{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--muted)}
section{margin-bottom:32px}
section,.hero{scroll-margin-top:16px}

/* countries */
.ctry{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;scroll-snap-type:x proximity}
.ctry::-webkit-scrollbar{display:none}
.cc{all:unset;box-sizing:border-box;flex:none;width:112px;scroll-snap-align:start;background:var(--surface);border-radius:18px;padding:11px 11px 9px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.cc:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.cc[aria-pressed="true"]{border-color:var(--indigo)}
.cc .flag{width:36px;height:24px;border-radius:5px}
.cc b{font-size:14px;font-weight:700;line-height:1.3}
.cc small{font-size:12px;line-height:1.35;color:var(--muted)}
.cc.has small{color:var(--green);font-weight:700}
.cc.none{opacity:.82}
.cc .bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.cc .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--indigo));border-radius:4px}
[dir=rtl] .cc .bar i{margin-inline-start:0}
.hint{font-size:13px;color:var(--muted);margin:2px 2px 0}

/* request */
.req{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.req>div{background:var(--surface);border-radius:18px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.req>div.wide{grid-column:1/-1}
.req .ri{width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.req .ri svg{width:18px;height:18px}
.req small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.req p{margin:0;font-size:14.5px;line-height:1.6}
.swatch{display:inline-block;width:13px;height:13px;border-radius:50%;background:#fff;border:1px solid #B9C0D3;vertical-align:-1px;margin-inline-end:6px}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.filters button .flag{width:18px;height:12px}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff}
.filters em{font-style:normal;font-size:12px;opacity:.7}

/* suppliers */
.list{display:flex;flex-direction:column;gap:10px}
.sup{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;position:relative}
.sup::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:var(--st,var(--line))}
.sup>button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px 14px 14px 14px;cursor:pointer}
.sup>button:focus-visible{outline:2px solid var(--indigo);outline-offset:-2px}
.av{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:.02em;position:relative;direction:ltr;color:#fff}
.av .flag{position:absolute;bottom:-3px;inset-inline-end:-5px;width:22px;height:15px;border-radius:3px;box-shadow:0 0 0 2px #fff}
.nm{font-weight:700;line-height:1.4;unicode-bidi:plaintext;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:4px;line-height:1.5;flex-wrap:wrap}
.sub svg{width:14px;height:14px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--indigo);background:var(--indigo-soft);border-radius:6px;padding:0 7px;margin-top:3px;direction:ltr;line-height:1.7}
.src svg{width:12px;height:12px}
.side{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pr{font-weight:900;font-size:15px;unicode-bidi:plaintext;white-space:nowrap;max-width:124px;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.pr.ask{font-weight:500;font-size:13px;color:var(--coral-ink);background:var(--coral-soft);border-radius:999px;padding:0 9px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-contacted,.s-replied{background:var(--indigo-soft);color:var(--indigo)}
.s-quoted,.s-negotiating{background:var(--saffron-soft);color:var(--saffron-ink)}
.s-agreed{background:var(--green-soft);color:var(--green)}
.s-declined{background:var(--coral-soft);color:var(--coral-ink)}
.chev{width:16px;height:16px;color:var(--muted);transition:transform .2s}
.sup.open .chev{transform:rotate(180deg)}
.det{display:none;padding:12px 16px 16px;font-size:14px;border-top:1px solid var(--line);background:#FAFBFE}
.sup.open .det{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.facts>div{background:var(--surface);border-radius:12px;padding:7px 10px;box-shadow:0 0 0 1px var(--line)}
.facts small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.facts b{font-weight:700;unicode-bidi:plaintext}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:0 9px 0 4px;unicode-bidi:plaintext}
.chip i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.note{color:var(--muted);margin:0 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:6px 13px;font-size:13px;text-decoration:none;color:var(--ink);cursor:pointer;font-weight:500}
.btn svg{width:16px;height:16px}
.btn.wa{color:#128C4B;box-shadow:0 0 0 1px #BFE7CF;background:#EFFAF3}
.btn.primary{background:linear-gradient(135deg,var(--indigo),#4646C2);box-shadow:0 6px 14px -8px rgba(91,91,214,.9);color:#fff}
.bench{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin:14px 0 0;position:relative;overflow:hidden}
.bench::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:linear-gradient(var(--green),var(--teal))}
.bench .bt{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bench .bt small{color:var(--muted);font-size:13px}
.bench .bt b{font-size:26px;font-weight:900;color:var(--green);unicode-bidi:plaintext}
.bench .rg{font-size:12.5px;color:var(--green);background:var(--green-soft);border-radius:999px;padding:1px 10px;font-weight:700;unicode-bidi:plaintext}
.bench p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.scale{position:relative;height:56px;margin:14px 6px 2px;direction:ltr}
.scale .ln{position:absolute;top:22px;left:0;right:0;height:8px;border-radius:99px;background:var(--line)}
.scale .ok{position:absolute;top:22px;height:8px;border-radius:99px;background:var(--green-soft);box-shadow:inset 0 0 0 1px #9ED8BC}
.scale .mk{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;white-space:nowrap}
.scale .mk i{width:14px;height:14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);margin-top:19px;order:2}
.scale .mk span{order:1;line-height:1.2}
.scale .mk em{order:3;font-style:normal;color:var(--muted);font-weight:500;margin-top:1px}
.legend{display:flex;flex-direction:column;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:block}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.rk{position:absolute;top:-6px;inset-inline-start:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--navy);color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;box-shadow:0 0 0 2px #fff;direction:ltr}
.chn{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 7px;line-height:1.75}
.ch-factory{background:var(--green-soft);color:var(--green)} .ch-distributor{background:var(--indigo-soft);color:var(--indigo)}
.ch-exporter{background:var(--saffron-soft);color:var(--saffron-ink)} .ch-dealer{background:var(--coral-soft);color:var(--coral-ink)} .ch-private{background:var(--line);color:var(--muted)}
.gap{font-size:11.5px;font-weight:700;unicode-bidi:plaintext;white-space:nowrap}
.gap.up{color:var(--coral-ink)} .gap.ok{color:var(--green)}
.sup.target{background:linear-gradient(180deg,#F3FBF7,#fff);box-shadow:0 0 0 2px #9ED8BC inset,var(--shadow)}
.sup.target .pr{color:var(--green)}
.tgt{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;color:var(--green);border:1.5px dashed var(--green);border-radius:999px;padding:0 8px;white-space:nowrap}
.stl{display:block;font-size:12px;color:var(--saffron-ink);margin-top:3px}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow)}

/* ask */
.ask{background:var(--surface);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow)}
.ask textarea{width:100%;min-height:100px;border:1px solid var(--line);border-radius:14px;background:#F8F9FD;padding:10px 12px;resize:vertical}
.ask .row{display:flex;gap:8px;margin-top:8px;align-items:center}
.ask select{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:7px 12px;font-size:14px}
.ask .btn.primary{padding:8px 18px;font-size:15px}
.msg{font-size:13px;color:var(--muted);margin:8px 2px 0;min-height:1em}

/* feed */
.feed{list-style:none;margin:0;padding:0;position:relative}
#feed{background:var(--surface);border-radius:var(--r-lg);padding:16px 14px 4px;box-shadow:var(--shadow)}
.feed li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:0 0 14px;position:relative}
.feed li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px var(--teal-soft);margin:8px 4px 0}
.feed li::after{content:"";position:absolute;inset-inline-start:8.5px;top:24px;bottom:0;width:1px;background:var(--line)}
.feed li:last-child::after{display:none}
.feed time{display:block;font-size:12px;color:var(--muted);line-height:1.4}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* bottom nav */
.nav{position:fixed;inset-inline:0;bottom:0;z-index:10;padding:0 12px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.nav div{pointer-events:auto;max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(27,35,80,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:22px;padding:6px;box-shadow:0 14px 30px -12px rgba(27,35,80,.7)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 4px;border-radius:16px;font-size:11.5px;color:#AEB3E6;text-decoration:none;line-height:1.3;position:relative}
.nav a svg{width:20px;height:20px}
.nav a[aria-current="true"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.nav a[aria-current="true"] svg{color:var(--saffron)}
.nav .n{position:absolute;top:2px;inset-inline-end:16%;font-size:10px;background:var(--coral);color:#fff;border-radius:999px;padding:0 5px;font-weight:800;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
@media (min-width:560px){.wrap{padding-top:26px}.count b{font-size:74px}.scene{height:210px}}
</style>
</head>
<body>

function fmtDate(s, time){
  if(!s) return "";
  const d = new Date(String(s).length === 10 ? s + "T12:00:00Z" : s);
  if(isNaN(d)) return esc(s);
  return d.toLocaleString(S.lang === "fa" ? "fa-IR" : "en-GB", time ? {dateStyle:"medium",timeStyle:"short"} : {month:"short",day:"numeric"});
}
function money(p){
  if(!p || p.amount == null) return "";
  let s; try { s = Number(p.amount).toLocaleString(loc(), {style:"currency",currency:p.currency||"USD",maximumFractionDigits:0}); }
  catch(e){ s = num(p.amount) + " " + (p.currency||""); }
  return s + (p.basis ? " " + p.basis : "");
}

function country(s){

function norm(id, d){
  const s = {id, ...d};
  const st = String(s.status||"found").toLowerCase();
  s.status = ORDER.find(o => st.startsWith(o)) || (st.startsWith("offer")?"quoted":st.startsWith("no")||st.startsWith("reject")?"declined":"found");
  if(!s.kind){ const ty = String(s.type||"").toLowerCase();
    s.kind = /dealer|4s|showroom/.test(ty) ? "dealer" : /export|trad/.test(ty) ? "exporter" : /^byd|factory/.test(ty) ? "byd" : "other"; }
  if(s.units == null && s.qty_available != null) s.units = s.qty_available;
  if(typeof s.units === "string" && /^\d[\d,]*$/.test(s.units)) s.units = Number(s.units.replace(/,/g,""));
  if(!s.price){
    if(s.price_quoted_usd != null && s.price_quoted_usd !== "") s.price = {amount:Number(String(s.price_quoted_usd).replace(/[^\d.]/g,""))||null, currency:"USD", basis:s.incoterm||""};

  }
  if(typeof s.colors === "string") s.colors = s.colors.split(/[,،]/).map(x=>x.trim()).filter(Boolean);
  if(!s.trim && s.trim_match) s.trim = s.trim_match;
  if(!s.contact_url) s.contact_url = s.source || "";
  s.up = s.unit_price_usd != null && s.unit_price_usd !== "" ? Number(s.unit_price_usd) : null;
  s.isTarget = /target/i.test(String(d.status||"") + " " + pick(d.status_label && d.status_label.en || ""));
  s.cc = country(s);
  return s;
}

          <span style="min-width:0"><span class="nm">${esc(pick(s.name))}</span>
            <span class="sub">${icon("pin")}${esc(where)}<span aria-hidden="true">•</span>${pick(s.channel_label)?`<span class="chn ch-${esc(s.channel||"")}">${esc(pick(s.channel_label))}</span>`:esc(t.kind[s.kind])}</span>
            ${pick(s.status_label)?`<span class="stl">${esc(pick(s.status_label))}</span>`:""}
            ${platform(s.source||s.contact_url)?`<span class="src">${icon("globe")}${esc(platform(s.source||s.contact_url))}</span>`:""}</span>
          <span class="side">${price?`<span class="pr">${s.isTarget?"≈ ":""}${esc(price)}</span>`:`<span class="pr ask">${t.askPrice}</span>`}${gap}
            ${s.isTarget?`<span class="tgt">${t.targetPill}</span>`:`<span class="pill s-${esc(s.status)}">${t.status[s.status]}</span>`}${icon("down","i chev")}</span>
        </button>
        <div class="det">
          <div class="facts">${facts.map(f=>`<div><small>${f[0]}</small><b>${esc(f[1])}</b></div>`).join("")}</div>
          ${s.trim?`<p class="note"><b style="color:var(--ink);font-weight:700">${t.option}:</b> <span style="unicode-bidi:plaintext">${esc(pick(s.trim))}</span></p>`:""}
          ${colors?`<div class="chips">${colors}</div>`:""}
          ${pick(s.next)?`<p class="note">${esc(pick(s.next))}</p>`:""}
          ${pick(s.notes)?`<p class="note">${esc(pick(s.notes))}</p>`:""}
          ${tl.length?`<ul class="feed" style="margin-bottom:8px">${tl.map(e=>`<li><span><time>${fmtDate(e.date)}</time>${esc(e[S.lang]||e.en||e.fa||e.text)}</span></li>`).join("")}</ul>`:""}
          <div class="acts">
            ${wa?`<a class="btn wa" href="${esc(wa)}" target="_blank" rel="noopener">${icon("wa")}${t.wa}</a>`:""}
            ${mail?`<a class="btn" href="${esc(mail)}">${icon("mail")}${t.mail}</a>`:""}
            ${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">${icon("link")}${t.open}</a>`:""}
            <button class="btn primary" type="button" data-ask="${esc(s.id)}">${icon("ask")}${t.ask}</button>
          </div>
        </div></div>`;
    }).join("");

  const sel = $("askSup"), cur = sel.value;
  sel.innerHTML = `<option value="">${t.anySup}</option>` + sup.map(s => `<option value="${esc(s.id)}">${esc(pick(s.name))}</option>`).join("");
  sel.value = sup.some(s => s.id === cur) ? cur : "";
  $("tabN").textContent = sup.length ? num(sup.length) : "";
  $("askMsg").textContent = S.msg ? t[S.msg] : "";

  const items = [...S.inst.map(i => ({date:i.createdAt, html:`<b>${esc(i.text)}</b>${pick(i.reply)?`<br><span style="color:var(--muted)">${t.agentReply} ${esc(pick(i.reply))}</span>`:""}`})),
                 ...S.log.map(a => ({date:a.date, html:esc(pick(a.text))}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  $("feed").innerHTML = items.length ? items.map(a => `<li><span><time>${fmtDate(a.date, true)}</time>${a.html}</span></li>`).join("")
    : `<li style="display:block;color:var(--muted)">${t.noLog}</li>`;
}

async function load(){
  try{
    const r = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    S.suppliers = (d.suppliers||[]).map(x => norm(x.id, x));
    S.meta = d.meta || {updated:d.updated}; S.bench = d.benchmark || (d.meta && d.meta.benchmark) || null;
    S.log = d.log || []; S.inst = d.instructions || []; S.loadFail = false;
  }catch(e){ if(S.suppliers === null) S.suppliers = []; S.loadFail = true; }
  render();
}
function send(){
  const text = $("askText").value.trim();
  if(!text){ $("askText").focus(); return; }
  const sid = $("askSup").value, sup = (S.suppliers||[]).find(x => x.id === sid);
  const title = "دستور / Instruction: " + text.replace(/\s+/g," ").slice(0,60);
  const body = text + (sup ? "\n\nSupplier: " + pick(sup.name) + " (" + sid + ")" : "") + "\n\nLanguage: " + S.lang;
  window.open(`https://github.com/${REPO}/issues/new?labels=instruction&title=${encodeURIComponent(title)}&body=${encodeURIComponent(body)}`, "_blank", "noopener");
  S.msg = "sentGh"; $("askText").value = ""; render();
}
document.addEventListener("click", e => {
  const lb = e.target.closest("[data-lang]");
  if(lb){ S.lang = lb.dataset.lang; try{localStorage.setItem("lang",S.lang)}catch(_){} render(); return; }
  const cb = e.target.closest("[data-c]");
  if(cb){ const c = cb.dataset.c; S.country = (S.country === c && cb.classList.contains("cc")) ? "all" : c; S.filter = "all"; render();
    if(cb.classList.contains("cc")) $("supSec").scrollIntoView({behavior:"smooth",block:"start"}); return; }
  const fb = e.target.closest("[data-f]");
  if(fb){ S.filter = fb.dataset.f; render(); return; }
  const ab = e.target.closest("[data-ask]");
  if(ab){ $("askSup").value = ab.dataset.ask; $("askSec").scrollIntoView({behavior:"smooth",block:"start"}); setTimeout(()=>$("askText").focus({preventScroll:true}),400); return; }
  if(e.target.closest("#askSend")){ send(); return; }
  const sb = e.target.closest(".sup>button");
  if(sb){ const id = sb.dataset.id; S.open.has(id) ? S.open.delete(id) : S.open.add(id); render(); }
});
const tabs = [...document.querySelectorAll("[data-tab]")];
function markTab(){
  const y = window.scrollY + 140; let cur = "top";
  for(const a of tabs){ const el = $(a.dataset.tab); if(el && el.offsetTop <= y) cur = a.dataset.tab; }
  if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) cur = tabs[tabs.length-1].dataset.tab;
  tabs.forEach(a => a.setAttribute("aria-current", a.dataset.tab === cur));
}
let pinned = null, pinT;
addEventListener("scroll", () => { if(!pinned) markTab(); }, {passive:true});
tabs.forEach(a => a.addEventListener("click", () => { pinned = a.dataset.tab; tabs.forEach(x => x.setAttribute("aria-current", x === a)); clearTimeout(pinT); pinT = setTimeout(() => pinned = null, 1200); }));
document.documentElement.style.scrollBehavior = matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth";
render(); markTab(); load(); setInterval(load, 5*60*1000);
</script>
</body>
